name: Build Coruja Finance v1.8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore private decryption key
        id: private-key-cache
        uses: actions/cache@v4
        with:
          path: .coruja-ci/private.pem
          key: coruja-apk-private-80e889859ef4

      - name: Require cached private key
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.private-key-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "The private key cache is unavailable." >&2
            exit 1
          fi
          test -s .coruja-ci/private.pem

      - name: Reconstruct Coruja Finance v1.8
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .build-input/build-v18.sh
          PRIVATE_KEY="$GITHUB_WORKSPACE/.coruja-ci/private.pem" .build-input/build-v18.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile signed release APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
        working-directory: Corujinha-Finance-codigo-fonte
        run: |
          set -o pipefail
          gradle --no-daemon clean :app:assembleRelease --stacktrace 2>&1 | tee ../Coruja-Finance-v1.8-build.log

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/Corujinha-Finance-codigo-fonte"
          APK="$(find "$SRC/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee Coruja-Finance-v1.8-signature.txt
          unzip -t "$APK"
          cp "$APK" Coruja-Finance-v1.8.apk
          zip -qr Coruja-Finance-codigo-fonte-v1.8.zip Corujinha-Finance-codigo-fonte \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12' '*/.kotlin/*' '*/keystore.properties'
          sha256sum Coruja-Finance-v1.8.apk | tee Coruja-Finance-v1.8-SHA256.txt

      - name: Upload APK and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.8-Android
          path: |
            Coruja-Finance-v1.8.apk
            Coruja-Finance-codigo-fonte-v1.8.zip
            Coruja-Finance-v1.8-SHA256.txt
            Coruja-Finance-v1.8-signature.txt
            Coruja-Finance-v1.8-build.log
          if-no-files-found: warn
          retention-days: 1
