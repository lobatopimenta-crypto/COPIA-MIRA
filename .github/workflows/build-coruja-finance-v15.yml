name: Build Coruja Finance v1.5

on:
  pull_request:
    branches: [main]
    paths:
      - '.build-input/coruja-v13.part*'
      - '.build-input/coruja-v14-patch.part*'
      - '.build-input/coruja-v14-components-fix.b64'
      - '.build-input/coruja-v15-patch.b64'
      - '.github/workflows/build-coruja-finance-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .build-input/coruja-v13.part00 .build-input/coruja-v13.part01 .build-input/coruja-v13.part02 .build-input/coruja-v13.part03 .build-input/coruja-v13.part04 .build-input/coruja-v13.part05 .build-input/coruja-v13.part06 .build-input/coruja-v13.part07 | base64 --decode > coruja-v13-source.tar.xz
          echo "76b9ba4aee4999bf8b167056f055663873f496521412ec5c5b62a879d21d6de3  coruja-v13-source.tar.xz" | sha256sum --check
          tar -xJf coruja-v13-source.tar.xz

      - name: Apply v1.4 source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .build-input/coruja-v14-patch.part00a .build-input/coruja-v14-patch.part00b .build-input/coruja-v14-patch.part01a .build-input/coruja-v14-patch.part01b .build-input/coruja-v14-patch.part02 .build-input/coruja-v14-patch.part03 | base64 --decode > coruja-v14-patch.tar.xz
          echo "7a0ff60335a9c536108c9fc0aca8fcedd66122a2bc88a7b3303832bd302c23af  coruja-v14-patch.tar.xz" | sha256sum --check
          tar -xJf coruja-v14-patch.tar.xz -C Corujinha-Finance-codigo-fonte
          base64 --decode .build-input/coruja-v14-components-fix.b64 > coruja-v14-components-fix.tar.xz
          echo "cf702f40c5d42f5a44933313c37166eec862fe0a5a0c32d093c6fcb993d83daf  coruja-v14-components-fix.tar.xz" | sha256sum --check
          tar -xJf coruja-v14-components-fix.tar.xz -C Corujinha-Finance-codigo-fonte

      - name: Apply v1.5 patch
        shell: bash
        run: |
          set -euo pipefail
          echo "a39ac836952712d90ce6bee1f15b197d056fc75229a94f73c89b63e6ac19a0c2  .build-input/coruja-v15-patch.b64" | sha256sum --check
          base64 --decode .build-input/coruja-v15-patch.b64 > coruja-v15-patch.tar.xz
          echo "b3ace6b5e3ff214e8d59e24f6de67be5784117fcbdff34f528553fdc18e922e5  coruja-v15-patch.tar.xz" | sha256sum --check
          tar -xJf coruja-v15-patch.tar.xz -C Corujinha-Finance-codigo-fonte
          while IFS= read -r path; do
            rm -f "Corujinha-Finance-codigo-fonte/$path"
          done < Corujinha-Finance-codigo-fonte/delete-list.txt
          rm -f Corujinha-Finance-codigo-fonte/delete-list.txt

      - name: Validate requested v1.5 features
        shell: bash
        run: |
          set -euo pipefail
          SRC='Corujinha-Finance-codigo-fonte'
          grep -Fq 'versionName = "1.5"' "$SRC/app/build.gradle.kts"
          grep -Fq 'versionCode = 6' "$SRC/app/build.gradle.kts"
          ! grep -Rq 'Entrar com impressão digital' "$SRC/app/src/main/java/com/example"
          ! grep -Rq 'Abrir com impressão digital' "$SRC/app/src/main/java/com/example"
          ! grep -Rq 'Tipo de Uso do Aplicativo' "$SRC/app/src/main/java/com/example"
          ! grep -Rq 'E-mail (opcional)' "$SRC/app/src/main/java/com/example"
          ! test -f "$SRC/app/src/main/java/com/example/ui/security/BiometricSecurity.kt"
          grep -Fq 'GoalSummaryBlock' "$SRC/app/src/main/java/com/example/ui/screens/GoalsScreen.kt"
          grep -Fq 'title = "Poupança acumulada"' "$SRC/app/src/main/java/com/example/ui/screens/GoalsScreen.kt"
          grep -Fq 'title = "Gastos controlados"' "$SRC/app/src/main/java/com/example/ui/screens/GoalsScreen.kt"
          grep -Fq 'modifier = Modifier.weight(1f)' "$SRC/app/src/main/java/com/example/ui/components/Components.kt"
          grep -Fq 'label = "Despesas"' "$SRC/app/src/main/java/com/example/ui/components/Components.kt"
          grep -Fq 'textAlign = TextAlign.Center' "$SRC/app/src/main/java/com/example/ui/components/Components.kt"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build complete installable APK
        working-directory: Corujinha-Finance-codigo-fonte
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK and package source
        shell: bash
        run: |
          set -euo pipefail
          APK='Corujinha-Finance-codigo-fonte/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          cp "$APK" Coruja-Finance-v1.5-Completo.apk
          zip -qr Coruja-Finance-codigo-fonte-v1.5.zip Corujinha-Finance-codigo-fonte -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12' '*/.kotlin/*'
          sha256sum Coruja-Finance-v1.5-Completo.apk | tee Coruja-Finance-v1.5-APK-SHA256.txt
          sha256sum Coruja-Finance-codigo-fonte-v1.5.zip | tee Coruja-Finance-v1.5-Fonte-SHA256.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.5-Completo
          path: |
            Coruja-Finance-v1.5-Completo.apk
            Coruja-Finance-codigo-fonte-v1.5.zip
            Coruja-Finance-v1.5-APK-SHA256.txt
            Coruja-Finance-v1.5-Fonte-SHA256.txt
          if-no-files-found: error
          retention-days: 7
