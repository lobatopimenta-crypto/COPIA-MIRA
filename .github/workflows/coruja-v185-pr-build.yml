name: Temporary PR Coruja Finance v1.8.5 Signed Build

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  build:
    if: github.head_ref == 'temp/coruja-apk-80e889859ef4'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Restore temporary transport key
        id: transport-key-cache
        uses: actions/cache@v4
        with:
          path: .coruja-v185/private.pem
          key: coruja-v185-private-20260801-8f2c

      - name: Reconstruct v1.8.5 source and signing files
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.transport-key-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "Temporary transport key cache unavailable." >&2
            exit 1
          fi
          test -s .coruja-v185/private.pem

          BASE="$GITHUB_WORKSPACE/v185-base"
          git fetch --depth=1 origin 30179a3eb3b9395cfd3d4e3dde76b44c0f45f3b0
          git worktree add "$BASE" FETCH_HEAD
          cd "$BASE"
          chmod +x .build-input/build-v18-unsigned.sh
          .build-input/build-v18-unsigned.sh
          SRC="$BASE/Corujinha-Finance-codigo-fonte"
          test -d "$SRC"

          cat "$GITHUB_WORKSPACE"/.build-input/v185-final/part-*.b64 | base64 -d > "$GITHUB_WORKSPACE/v185-delta.enc"
          base64 -d "$GITHUB_WORKSPACE/.build-input/v185-final/keyinfo.b64" > "$GITHUB_WORKSPACE/v185-keyinfo.enc"
          echo "542e5e9f79ebc853fa154621b9239834f1fe1c00cd64ea89a2801891320078c1  $GITHUB_WORKSPACE/v185-delta.enc" | sha256sum -c -
          echo "20a37b0c15f8c8ee9768fd817c2bcdccd12ae247ddd063d0a6fc5b6cc4bd26fb  $GITHUB_WORKSPACE/v185-keyinfo.enc" | sha256sum -c -
          openssl pkeyutl -decrypt \
            -inkey "$GITHUB_WORKSPACE/.coruja-v185/private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$GITHUB_WORKSPACE/v185-keyinfo.enc" \
            -out "$GITHUB_WORKSPACE/v185-keyinfo.txt"
          source "$GITHUB_WORKSPACE/v185-keyinfo.txt"
          openssl enc -d -aes-256-cbc -nosalt \
            -K "$KEYHEX" -iv "$IVHEX" \
            -in "$GITHUB_WORKSPACE/v185-delta.enc" \
            -out "$GITHUB_WORKSPACE/v185-delta.tar.xz"
          echo "5c66389e5536ba8220962ee7a9af48a7937e98e93e0132623e10c04a3169c6e2  $GITHUB_WORKSPACE/v185-delta.tar.xz" | sha256sum -c -
          tar -xJf "$GITHUB_WORKSPACE/v185-delta.tar.xz" -C "$SRC"

          base64 -d "$GITHUB_WORKSPACE/.build-input/v185-final/signing.b64" > "$GITHUB_WORKSPACE/v185-signing.enc"
          base64 -d "$GITHUB_WORKSPACE/.build-input/v185-final/signing-keyinfo.b64" > "$GITHUB_WORKSPACE/v185-signing-keyinfo.enc"
          echo "9b89dc626cca9d53236d47cbc0a87fbd2efc062fc2da113c547f81c3a68fa0c4  $GITHUB_WORKSPACE/v185-signing.enc" | sha256sum -c -
          echo "8cf4fb6caf08c8778f1255a73b26e5a62d2ee5533e78faf3dae574730520f91c  $GITHUB_WORKSPACE/v185-signing-keyinfo.enc" | sha256sum -c -
          openssl pkeyutl -decrypt \
            -inkey "$GITHUB_WORKSPACE/.coruja-v185/private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$GITHUB_WORKSPACE/v185-signing-keyinfo.enc" \
            -out "$GITHUB_WORKSPACE/v185-signing-keyinfo.txt"
          source "$GITHUB_WORKSPACE/v185-signing-keyinfo.txt"
          openssl enc -d -aes-256-cbc -nosalt \
            -K "$KEYHEX" -iv "$IVHEX" \
            -in "$GITHUB_WORKSPACE/v185-signing.enc" \
            -out "$GITHUB_WORKSPACE/v185-signing.tar.xz"
          echo "82c10a557a6bac23e17fe62727192730a63ee65e5e44451ee1bccfb56f95dba9  $GITHUB_WORKSPACE/v185-signing.tar.xz" | sha256sum -c -
          tar -xJf "$GITHUB_WORKSPACE/v185-signing.tar.xz" -C "$SRC"

          [[ -f "$SRC/.env" ]] || cp "$SRC/.env.example" "$SRC/.env"
          grep -Fq 'versionCode = 14' "$SRC/app/build.gradle.kts"
          grep -Fq 'versionName = "1.8.5"' "$SRC/app/build.gradle.kts"
          grep -Fq 'applicationId = "com.aistudio.corujinhafinancas.cdaccc"' "$SRC/app/build.gradle.kts"
          ! grep -Fq 'home_profile_image_card' "$SRC/app/src/main/java/com/example/ui/screens/DashboardScreen.kt"
          ! grep -Fq 'Sua Corujinha agora também está na página inicial' "$SRC/app/src/main/java/com/example/ui/screens/DashboardScreen.kt"
          grep -Fq 'img_corujinha_home_profile' "$SRC/app/src/main/java/com/example/ui/screens/SettingsScreen.kt"
          grep -Fq 'Editar' "$SRC/app/src/main/java/com/example/ui/screens/CardsScreen.kt"
          grep -Fq 'Excluir' "$SRC/app/src/main/java/com/example/ui/screens/CardsScreen.kt"
          test -s "$SRC/signing/coruja-finance-release.jks"
          test -s "$SRC/keystore.properties"
          echo "project_dir=$SRC" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile signed release APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
        run: |
          set -o pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          gradle --no-daemon clean :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-build.log"

      - name: Verify APK and update compatibility
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ steps.source.outputs.project_dir }}"
          APK="$(find "$SRC/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-signature.txt"
          grep -Fq 'certificate SHA-256 digest: 7b16b3080109df41b715386f4f4a6fbe05b0aeda31056d31de47a8fb9a1fb7b9' "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-badging.txt"
          grep -Fq "package: name='com.aistudio.corujinhafinancas.cdaccc' versionCode='14' versionName='1.8.5'" "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-badging.txt"
          grep -Fq "sdkVersion:'24'" "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-badging.txt"
          unzip -t "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5.apk"
          sha256sum "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5.apk" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.5-SHA256.txt"

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.8.5-Sem-Foto-Inicial
          path: |
            Coruja-Finance-v1.8.5.apk
            Coruja-Finance-v1.8.5-SHA256.txt
            Coruja-Finance-v1.8.5-signature.txt
            Coruja-Finance-v1.8.5-badging.txt
            Coruja-Finance-v1.8.5-build.log
          if-no-files-found: warn
          retention-days: 1
