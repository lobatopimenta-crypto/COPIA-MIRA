name: Build Coruja Finance v1.4

on:
  pull_request:
    branches: [main]
    paths:
      - '.build-input/coruja-v13.part*'
      - '.build-input/coruja-v14-patch.part*'
      - '.github/workflows/build-coruja-finance-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.3 source and apply v1.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .build-input/coruja-v13.part00 \
            .build-input/coruja-v13.part01 \
            .build-input/coruja-v13.part02 \
            .build-input/coruja-v13.part03 \
            .build-input/coruja-v13.part04 \
            .build-input/coruja-v13.part05 \
            .build-input/coruja-v13.part06 \
            .build-input/coruja-v13.part07 \
            | base64 --decode > coruja-v13-source.tar.xz
          echo "76b9ba4aee4999bf8b167056f055663873f496521412ec5c5b62a879d21d6de3  coruja-v13-source.tar.xz" | sha256sum --check
          tar -xJf coruja-v13-source.tar.xz

          cat \
            .build-input/coruja-v14-patch.part00 \
            .build-input/coruja-v14-patch.part01 \
            .build-input/coruja-v14-patch.part02 \
            .build-input/coruja-v14-patch.part03 \
            | base64 --decode > coruja-v14-patch.tar.xz
          echo "7a0ff60335a9c536108c9fc0aca8fcedd66122a2bc88a7b3303832bd302c23af  coruja-v14-patch.tar.xz" | sha256sum --check
          tar -xJf coruja-v14-patch.tar.xz -C Corujinha-Finance-codigo-fonte

          SRC='Corujinha-Finance-codigo-fonte'
          test -f "$SRC/app/src/main/java/com/example/MainActivity.kt"
          grep -Rq 'versionName = "1.4"' "$SRC/app/build.gradle.kts"
          grep -Rq 'DatePickerDialog' "$SRC/app/src/main/java/com/example/ui/screens/AddEditTransactionDialog.kt"
          grep -Rq 'installmentTotal' "$SRC/app/src/main/java/com/example/ui/screens/AddEditTransactionDialog.kt"
          grep -Rq 'onEditGoal' "$SRC/app/src/main/java/com/example/ui/screens/GoalsScreen.kt"
          grep -Rq 'setDarkModeEnabled' "$SRC/app/src/main/java/com/example/ui/screens/SettingsScreen.kt"
          grep -Rq 'Entrar com impressão digital' "$SRC/app/src/main/java/com/example/ui/screens/LoginScreen.kt"
          grep -Rq 'Alignment.TopCenter' "$SRC/app/src/main/java/com/example/ui/components/Components.kt"
          ! grep -q 'TRANSFERENCIA' "$SRC/app/src/main/java/com/example/ui/screens/AddEditTransactionDialog.kt"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build complete installable APK
        working-directory: Corujinha-Finance-codigo-fonte
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK and package source
        shell: bash
        run: |
          set -euo pipefail
          APK='Corujinha-Finance-codigo-fonte/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          cp "$APK" Coruja-Finance-v1.4-Completo.apk
          zip -qr Coruja-Finance-codigo-fonte-v1.4.zip Corujinha-Finance-codigo-fonte \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12'
          sha256sum Coruja-Finance-v1.4-Completo.apk | tee Coruja-Finance-v1.4-APK-SHA256.txt
          sha256sum Coruja-Finance-codigo-fonte-v1.4.zip | tee Coruja-Finance-v1.4-Fonte-SHA256.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.4-Completo
          path: |
            Coruja-Finance-v1.4-Completo.apk
            Coruja-Finance-codigo-fonte-v1.4.zip
            Coruja-Finance-v1.4-APK-SHA256.txt
            Coruja-Finance-v1.4-Fonte-SHA256.txt
          if-no-files-found: error
          retention-days: 7
