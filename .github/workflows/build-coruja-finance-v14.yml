name: Diagnose Coruja Finance v1.4 patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.build-input/coruja-v14-patch.part*'
      - '.github/workflows/build-coruja-finance-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose patch blocks
        shell: bash
        run: |
          set +e
          {
            echo '=== file sizes ==='
            wc -c .build-input/coruja-v14-patch.part00 .build-input/coruja-v14-patch.part01 .build-input/coruja-v14-patch.part02 .build-input/coruja-v14-patch.part03
            echo '=== block hashes ==='
            sha256sum .build-input/coruja-v14-patch.part00 .build-input/coruja-v14-patch.part01 .build-input/coruja-v14-patch.part02 .build-input/coruja-v14-patch.part03
            cat .build-input/coruja-v14-patch.part00 .build-input/coruja-v14-patch.part01 .build-input/coruja-v14-patch.part02 .build-input/coruja-v14-patch.part03 > coruja-v14-patch.b64
            echo '=== combined base64 ==='
            wc -c coruja-v14-patch.b64
            sha256sum coruja-v14-patch.b64
            base64 --decode coruja-v14-patch.b64 > coruja-v14-patch.tar.xz
            echo "base64_exit=$?"
            echo '=== decoded archive ==='
            wc -c coruja-v14-patch.tar.xz
            sha256sum coruja-v14-patch.tar.xz
            xz -t coruja-v14-patch.tar.xz
            echo "xz_exit=$?"
            tar -tJf coruja-v14-patch.tar.xz
            echo "tar_exit=$?"
          } > patch-diagnostic.txt 2>&1
          cat patch-diagnostic.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-v14-patch-diagnostic
          path: patch-diagnostic.txt
          if-no-files-found: error
          retention-days: 7
