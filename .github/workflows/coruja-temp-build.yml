name: Temporary Coruja Finance APK Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore private key
        id: private-key-cache
        uses: actions/cache@v4
        with:
          path: .coruja-ci/private.pem
          key: coruja-apk-private-80e889859ef4

      - name: Generate private key
        if: steps.private-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .coruja-ci
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out .coruja-ci/private.pem

      - name: Export and upload public key
        run: openssl pkey -in .coruja-ci/private.pem -pubout -out .coruja-ci/public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: coruja-public-key-80e889859ef4
          path: .coruja-ci/public.pem
          retention-days: 1

      - name: Reconstruct encrypted project
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .coruja-ci/comments .coruja-ci/decrypted
          gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > .coruja-ci/comments/comments.json
          jq -r '.[] | select(.body | startswith("CORUJA_MIN_PART_")) | .body' .coruja-ci/comments/comments.json \
            | awk 'BEGIN{RS="CORUJA_MIN_PART_";ORS=""} NR>1{h=substr($0,1,index($0,"\n")-1);p=substr($0,index($0,"\n")+1);gsub(/\r|\n/,"",p);print h "\t" p "\n"}' \
            | sort -k1,1 | cut -f2- | tr -d '\n' > .coruja-ci/comments/source.b64
          jq -r '.[] | select(.body | startswith("CORUJA_MIN_KEY")) | .body' .coruja-ci/comments/comments.json \
            | tail -n +2 | tr -d '\r\n' > .coruja-ci/comments/key.b64
          base64 -d .coruja-ci/comments/source.b64 > .coruja-ci/source.enc
          base64 -d .coruja-ci/comments/key.b64 > .coruja-ci/key.enc
          echo "b699573d6cbdb08a3acba95095f799a1959b55524e1276a62dfc6a91c72a7ffb  .coruja-ci/source.enc" | sha256sum -c -
          echo "76ebf7e937d5dc098a4a2266de22260e87a4804992a3201c5fa1dc99c61087f1  .coruja-ci/key.enc" | sha256sum -c -
          openssl pkeyutl -decrypt -inkey .coruja-ci/private.pem -in .coruja-ci/key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out .coruja-ci/password.txt
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 -in .coruja-ci/source.enc \
            -out .coruja-ci/project.tar.xz -pass file:.coruja-ci/password.txt
          echo "fa5cd05107fa5bfa758e2e681472f74f50af9106e5b8b015554a7b1b34dbd45d  .coruja-ci/project.tar.xz" | sha256sum -c -
          tar -xJf .coruja-ci/project.tar.xz -C .coruja-ci/decrypted
          find .coruja-ci/decrypted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1 > .coruja-ci/project-dir

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile and verify APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
        run: |
          set -euo pipefail
          cd "$(cat "$GITHUB_WORKSPACE/.coruja-ci/project-dir")"
          gradle --no-daemon --stacktrace clean :app:assembleRelease
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Coruja-Finance-v1.6.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/Coruja-Finance-v1.6.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.6-Android
          path: Coruja-Finance-v1.6.apk
          retention-days: 1
