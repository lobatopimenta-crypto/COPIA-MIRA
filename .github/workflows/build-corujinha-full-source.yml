name: Build Coruja Finance v1.3

on:
  pull_request:
    branches: [main]
    paths:
      - '.build-input/corujinha-source3.part*'
      - '.build-input/coruja-v12-overlay.part*'
      - '.build-input/coruja-v13-overlay.part*'
      - '.github/workflows/build-corujinha-full-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source and apply v1.3 changes
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .build-input/corujinha-source3.part00 \
            .build-input/corujinha-source3.part01a \
            .build-input/corujinha-source3.part01b \
            .build-input/corujinha-source3.part01c \
            .build-input/corujinha-source3.part02 \
            .build-input/corujinha-source3.part03a \
            .build-input/corujinha-source3.part03b \
            .build-input/corujinha-source3.part03c \
            .build-input/corujinha-source3.part04 \
            | base64 --decode > corujinha-source.tar.xz
          echo "61e87c528c3ccc1b09a45649e3703d69da2d34304ca521e8cf7fc6a7733f9b30  corujinha-source.tar.xz" | sha256sum --check
          tar -xJf corujinha-source.tar.xz

          cat \
            .build-input/coruja-v12-overlay.part00 \
            .build-input/coruja-v12-overlay.part01 \
            .build-input/coruja-v12-overlay.part02 \
            .build-input/coruja-v12-overlay.part03 \
            .build-input/coruja-v12-overlay.part04 \
            .build-input/coruja-v12-overlay.part05 \
            .build-input/coruja-v12-overlay.part06 \
            | base64 --decode > coruja-v12-overlay.tar.xz
          echo "c3017fce4e0219c46771fc603df8552d71e8a072a0812bdbe5d44facaeb8657a  coruja-v12-overlay.tar.xz" | sha256sum --check
          tar -xJf coruja-v12-overlay.tar.xz -C Corujinha-Finance-codigo-fonte

          cat .build-input/coruja-v13-overlay.part00 | base64 --decode > coruja-v13-overlay.tar.xz
          echo "37c00330734523fa8fa8d0e80b8552ca92d9d3eaa9026e893669ca765799d882  coruja-v13-overlay.tar.xz" | sha256sum --check
          tar -xJf coruja-v13-overlay.tar.xz -C Corujinha-Finance-codigo-fonte

          SRC='Corujinha-Finance-codigo-fonte'
          rm -f "$SRC/app/src/main/java/com/example/ui/security/BiometricSecurity.kt"
          test -f "$SRC/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'version = 3' "$SRC/app/src/main/java/com/example/data/local/AppDatabase.kt"
          grep -q 'versionName = "1.3"' "$SRC/app/build.gradle.kts"
          grep -Rq 'dueDateMillis' "$SRC/app/src/main/java"
          grep -Rq 'isConfirmed' "$SRC/app/src/main/java"
          grep -Rq 'isDarkModeEnabled' "$SRC/app/src/main/java"
          grep -Rq 'goalType' "$SRC/app/src/main/java"
          grep -Rq 'Confirmar recebimento' "$SRC/app/src/main/java"
          grep -Rq 'Confirmar pagamento' "$SRC/app/src/main/java"
          grep -Rq 'Modo escuro' "$SRC/app/src/main/java"
          ! grep -Rqi 'Autenticação biométrica\|Entrar com biometria\|quick_transfer\|onAddTransfer' "$SRC/app/src/main/java"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build complete installable APK
        working-directory: Corujinha-Finance-codigo-fonte
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK and source correspondence
        shell: bash
        run: |
          set -euo pipefail
          APK='Corujinha-Finance-codigo-fonte/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee Coruja-Finance-v1.3-APK-SHA256.txt
          cp "$APK" Coruja-Finance-v1.3-Completo.apk
          zip -qr Coruja-Finance-codigo-fonte-v1.3.zip Corujinha-Finance-codigo-fonte \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12'
          sha256sum Coruja-Finance-codigo-fonte-v1.3.zip | tee Coruja-Finance-v1.3-Fonte-SHA256.txt

      - name: Upload complete APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.3-Completo
          path: |
            Coruja-Finance-v1.3-Completo.apk
            Coruja-Finance-codigo-fonte-v1.3.zip
            Coruja-Finance-v1.3-APK-SHA256.txt
            Coruja-Finance-v1.3-Fonte-SHA256.txt
          if-no-files-found: error
          retention-days: 7
