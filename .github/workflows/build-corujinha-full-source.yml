name: Build Corujinha Full Source

on:
  pull_request:
    branches: [main]
    paths:
      - '.build-input/corujinha-source3.part*'
      - '.github/workflows/build-corujinha-full-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct complete source project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .build-input/corujinha-source3.part00 \
            .build-input/corujinha-source3.part01a \
            .build-input/corujinha-source3.part01b \
            .build-input/corujinha-source3.part01c \
            .build-input/corujinha-source3.part02 \
            .build-input/corujinha-source3.part03 \
            .build-input/corujinha-source3.part04 \
            | base64 --decode > corujinha-source.tar.xz
          echo "61e87c528c3ccc1b09a45649e3703d69da2d34304ca521e8cf7fc6a7733f9b30  corujinha-source.tar.xz" | sha256sum --check
          tar -xJf corujinha-source.tar.xz
          test -f 'Corujinha-Finance-codigo-fonte/app/src/main/java/com/example/MainActivity.kt'
          test -f 'Corujinha-Finance-codigo-fonte/app/src/main/res/drawable/img_corujinha_app_icon.jpg'
          ! grep -Rqi 'Importar backup\|Restaurar backup' 'Corujinha-Finance-codigo-fonte/app/src/main/java/com/example/ui/screens/SettingsScreen.kt'
          grep -Rq 'Corujinha Finance' 'Corujinha-Finance-codigo-fonte/app/src/main'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build complete installable APK
        working-directory: Corujinha-Finance-codigo-fonte
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK and source correspondence
        shell: bash
        run: |
          set -euo pipefail
          APK='Corujinha-Finance-codigo-fonte/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee Corujinha-Finance-APK-SHA256.txt
          cp "$APK" Corujinha-Finance-Completo-Final.apk
          zip -qr Corujinha-Finance-codigo-fonte-completo.zip Corujinha-Finance-codigo-fonte \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12'
          sha256sum Corujinha-Finance-codigo-fonte-completo.zip | tee Corujinha-Finance-Fonte-SHA256.txt

      - name: Upload complete APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Corujinha-Finance-Completo-Final
          path: |
            Corujinha-Finance-Completo-Final.apk
            Corujinha-Finance-codigo-fonte-completo.zip
            Corujinha-Finance-APK-SHA256.txt
            Corujinha-Finance-Fonte-SHA256.txt
          if-no-files-found: error
          retention-days: 7
