name: Build Coruja Finance v1.3

on:
  pull_request:
    branches: [main]
    paths:
      - '.build-input/coruja-v13.part*'
      - '.github/workflows/build-corujinha-full-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source chunk 00
        run: echo 'fa7166689ebb3db595820dd45ecac7d484d4418af3512ce293c53c5b808cdd04  .build-input/coruja-v13.part00' | sha256sum --check
      - name: Validate source chunk 01
        run: echo '766daded5d19c1848de9218be77b4ef6b17e3dc75fad12997822b9a25a0273ba  .build-input/coruja-v13.part01' | sha256sum --check
      - name: Validate source chunk 02
        run: echo '7820101cbc34f44542bb98b37f949bd9ac0ba6c7a0c58b1878485b924c965470  .build-input/coruja-v13.part02' | sha256sum --check
      - name: Validate source chunk 03
        run: echo '811b384f6bc54ffbed4a8248d82f18219de918832d342848ca93a8e700745858  .build-input/coruja-v13.part03' | sha256sum --check
      - name: Validate source chunk 04
        run: echo '0783220b7db8b981d41f7ea621c94154a0656465886341bfe6185fecf83ab97e  .build-input/coruja-v13.part04' | sha256sum --check
      - name: Validate source chunk 05
        run: echo 'd4855ea4214c54b61b41db10cee8e28e2d71dbd2c9a37a71a83bd48f7913d5d4  .build-input/coruja-v13.part05' | sha256sum --check
      - name: Validate source chunk 06
        run: echo 'f611d050a85dc2a4fd7176090a040101d0ec54c78eb14efd891b6f4b0e959e29  .build-input/coruja-v13.part06' | sha256sum --check

      - name: Reconstruct complete v1.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .build-input/coruja-v13.part00 \
            .build-input/coruja-v13.part01 \
            .build-input/coruja-v13.part02 \
            .build-input/coruja-v13.part03 \
            .build-input/coruja-v13.part04 \
            .build-input/coruja-v13.part05 \
            .build-input/coruja-v13.part06 \
            | base64 --decode > coruja-v13-source.tar.xz
          echo '350f54d253a934995dc2c51b1e94831e71da8484e03979a1b2360345f290cd91  coruja-v13-source.tar.xz' | sha256sum --check
          tar -xJf coruja-v13-source.tar.xz

          SRC='Corujinha-Finance-codigo-fonte'
          test -f "$SRC/app/src/main/java/com/example/MainActivity.kt"
          test -f "$SRC/app/src/main/java/com/example/data/local/AppDatabase.kt"
          grep -q 'versionCode = 4' "$SRC/app/build.gradle.kts"
          grep -q 'versionName = "1.3"' "$SRC/app/build.gradle.kts"
          grep -q 'version = 3' "$SRC/app/src/main/java/com/example/data/local/AppDatabase.kt"
          grep -Rq 'dueDateMillis' "$SRC/app/src/main/java"
          grep -Rq 'isConfirmed' "$SRC/app/src/main/java"
          grep -Rq 'Modo escuro' "$SRC/app/src/main/java/com/example/ui/screens/SettingsScreen.kt"
          grep -Rq 'LIMITE_GASTO' "$SRC/app/src/main/java"
          grep -Rq 'Confirmar recebimento' "$SRC/app/src/main/java"
          grep -Rq 'onEditTransaction' "$SRC/app/src/main/java"
          ! grep -Rqi 'Autenticação biométrica\|authenticateWithBiometrics\|quick_transfer\|onAddTransfer' "$SRC/app/src/main"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build complete installable APK
        working-directory: Corujinha-Finance-codigo-fonte
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK and source correspondence
        shell: bash
        run: |
          set -euo pipefail
          APK='Corujinha-Finance-codigo-fonte/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee Coruja-Finance-v1.3-APK-SHA256.txt
          cp "$APK" Coruja-Finance-v1.3-Completo.apk
          zip -qr Coruja-Finance-codigo-fonte-v1.3.zip Corujinha-Finance-codigo-fonte \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12'
          sha256sum Coruja-Finance-codigo-fonte-v1.3.zip | tee Coruja-Finance-v1.3-Fonte-SHA256.txt

      - name: Upload complete APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.3-Completo
          path: |
            Coruja-Finance-v1.3-Completo.apk
            Coruja-Finance-codigo-fonte-v1.3.zip
            Coruja-Finance-v1.3-APK-SHA256.txt
            Coruja-Finance-v1.3-Fonte-SHA256.txt
          if-no-files-found: error
          retention-days: 7
