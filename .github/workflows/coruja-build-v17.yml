name: Secure Coruja Finance v1.7 APK Build

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4

      - name: Restore private decryption key
        id: private-key-cache
        uses: actions/cache@v4
        with:
          path: .coruja-ci/private.pem
          key: coruja-apk-private-80e889859ef4

      - name: Require cached private key
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.private-key-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "The private signing-decryption key cache is unavailable." >&2
            exit 1
          fi
          test -s .coruja-ci/private.pem

      - name: Fetch v1.7 build inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin build-coruja-finance-v17-final
          git worktree add "$GITHUB_WORKSPACE/v17-input" FETCH_HEAD
          chmod +x "$GITHUB_WORKSPACE/v17-input/.build-input/build-v17.sh"
          cd "$GITHUB_WORKSPACE/v17-input"
          PRIVATE_KEY="$GITHUB_WORKSPACE/.coruja-ci/private.pem" .build-input/build-v17.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile signed release APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/v17-input/Corujinha-Finance-codigo-fonte"
          gradle --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.7-build.log"

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/v17-input/Corujinha-Finance-codigo-fonte"
          APK="$(find "$SRC/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.7-signature.txt"
          unzip -t "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Coruja-Finance-v1.7.apk"
          cd "$GITHUB_WORKSPACE/v17-input"
          zip -qr "$GITHUB_WORKSPACE/Coruja-Finance-codigo-fonte-v1.7.zip" Corujinha-Finance-codigo-fonte \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore' '*.p12' '*/.kotlin/*' '*/keystore.properties'
          sha256sum "$GITHUB_WORKSPACE/Coruja-Finance-v1.7.apk" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.7-SHA256.txt"

      - name: Upload APK, source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.7-Android
          path: |
            Coruja-Finance-v1.7.apk
            Coruja-Finance-codigo-fonte-v1.7.zip
            Coruja-Finance-v1.7-SHA256.txt
            Coruja-Finance-v1.7-signature.txt
            Coruja-Finance-v1.7-build.log
          if-no-files-found: warn
          retention-days: 1
