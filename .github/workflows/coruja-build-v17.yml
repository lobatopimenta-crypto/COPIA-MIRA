name: Temporary Coruja Finance v1.7 APK Build

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Restore private decryption key
        id: private-key-cache
        uses: actions/cache@v4
        with:
          path: .coruja-ci/private.pem
          key: coruja-apk-private-80e889859ef4

      - name: Require cached private key
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.private-key-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "The temporary private key cache was not found." >&2
            exit 1
          fi
          test -s .coruja-ci/private.pem

      - name: Decode and decrypt Android project
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          base64 -d coruja-v17-key.enc.b64 > .coruja-ci/key.enc
          cat coruja-v17-source.part-* | base64 -d > .coruja-ci/source.enc
          openssl pkeyutl -decrypt \
            -inkey .coruja-ci/private.pem \
            -in .coruja-ci/key.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out .coruja-ci/password.txt
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in .coruja-ci/source.enc \
            -out .coruja-ci/source.zip \
            -pass file:.coruja-ci/password.txt
          mkdir -p .coruja-ci/decrypted
          unzip -q .coruja-ci/source.zip -d .coruja-ci/decrypted
          PROJECT_DIR="$(find .coruja-ci/decrypted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile signed release APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
        run: |
          set -euo pipefail
          cd "${{ steps.decrypt.outputs.project_dir }}"
          gradle --no-daemon --stacktrace clean :app:assembleRelease
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Coruja-Finance-v1.7.apk"
          apksigner verify --verbose --print-certs "$GITHUB_WORKSPACE/Coruja-Finance-v1.7.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.7-Android
          path: Coruja-Finance-v1.7.apk
          if-no-files-found: error
          retention-days: 1
