name: Build Corujinha APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'corujinha-build/**'
      - '.github/workflows/build-corujinha-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild complete app interface
        shell: bash
        run: |
          cat corujinha-build/payload/index.part* | base64 --decode > corujinha-build/app/src/main/assets/index.html
          test -s corujinha-build/app/src/main/assets/index.html
          grep -q 'Corujinha Finanças' corujinha-build/app/src/main/assets/index.html
          grep -q 'listaCartoes' corujinha-build/app/src/main/assets/index.html
          grep -q 'listaMetas' corujinha-build/app/src/main/assets/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: corujinha-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK structure and signature
        shell: bash
        run: |
          APK='corujinha-build/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee corujinha-apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corujinha-Financas-Completo-APK
          path: |
            corujinha-build/app/build/outputs/apk/debug/app-debug.apk
            corujinha-apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
