name: Secure Coruja Finance v1.8.4 Signed Build

on:
  push:
    branches:
      - temp/coruja-apk-80e889859ef4
    paths:
      - .build-input/v184/trigger.txt

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Restore private decryption key
        id: private-key-cache
        uses: actions/cache@v4
        with:
          path: .coruja-ci/private.pem
          key: coruja-apk-private-80e889859ef4

      - name: Require cached private key
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.private-key-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "Private decryption key cache unavailable." >&2
            exit 1
          fi
          test -s .coruja-ci/private.pem

      - name: Restore encrypted v1.8.4 project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/v184-work"
          cat .build-input/v184/part-*.b64 | base64 -d > "$GITHUB_WORKSPACE/v184-payload.enc"
          base64 -d .build-input/v184/keyinfo.b64 > "$GITHUB_WORKSPACE/v184-keyinfo.enc"
          echo "ae648d750c056cfc6307b565a050eac1500e302a49420612c7bb62a73502f6f3  $GITHUB_WORKSPACE/v184-payload.enc" | sha256sum -c -
          echo "9491bc289a64e69dbc2939163c9f9fd9e201230516c2cebbfbdb8136d00c64a0  $GITHUB_WORKSPACE/v184-keyinfo.enc" | sha256sum -c -
          openssl pkeyutl -decrypt \
            -inkey .coruja-ci/private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$GITHUB_WORKSPACE/v184-keyinfo.enc" \
            -out "$GITHUB_WORKSPACE/v184-keyinfo.txt"
          source "$GITHUB_WORKSPACE/v184-keyinfo.txt"
          openssl enc -d -aes-256-cbc -nosalt \
            -K "$KEYHEX" -iv "$IVHEX" \
            -in "$GITHUB_WORKSPACE/v184-payload.enc" \
            -out "$GITHUB_WORKSPACE/v184-project.zip"
          echo "1ea9f2b1a4c09ec2d6a8aba671ee820bc80ba0e714b5ebca5aa046d88530bab6  $GITHUB_WORKSPACE/v184-project.zip" | sha256sum -c -
          unzip -q "$GITHUB_WORKSPACE/v184-project.zip" -d "$GITHUB_WORKSPACE/v184-work"
          SRC="$GITHUB_WORKSPACE/v184-work/Corujinha-Finance-codigo-fonte"
          grep -Fq 'versionCode = 13' "$SRC/app/build.gradle.kts"
          grep -Fq 'versionName = "1.8.4"' "$SRC/app/build.gradle.kts"
          grep -Fq 'applicationId = "com.aistudio.corujinhafinancas.cdaccc"' "$SRC/app/build.gradle.kts"
          test -s "$SRC/signing/coruja-finance-release.jks"
          test -s "$SRC/keystore.properties"
          echo "project_dir=$SRC" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile signed release APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
        run: |
          set -o pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          gradle --no-daemon clean :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-build.log"

      - name: Verify APK installation compatibility
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ steps.source.outputs.project_dir }}"
          APK="$(find "$SRC/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-signature.txt"
          grep -Fq 'certificate SHA-256 digest: 7b16b3080109df41b715386f4f4a6fbe05b0aeda31056d31de47a8fb9a1fb7b9' "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-badging.txt"
          grep -Fq "package: name='com.aistudio.corujinhafinancas.cdaccc' versionCode='13' versionName='1.8.4'" "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-badging.txt"
          grep -Fq "sdkVersion:'24'" "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-badging.txt"
          unzip -t "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4.apk"
          sha256sum "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4.apk" | tee "$GITHUB_WORKSPACE/Coruja-Finance-v1.8.4-SHA256.txt"

      - name: Upload signed APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coruja-Finance-v1.8.4-Assinado
          path: |
            Coruja-Finance-v1.8.4.apk
            Coruja-Finance-v1.8.4-SHA256.txt
            Coruja-Finance-v1.8.4-signature.txt
            Coruja-Finance-v1.8.4-badging.txt
            Coruja-Finance-v1.8.4-build.log
          if-no-files-found: warn
          retention-days: 1
